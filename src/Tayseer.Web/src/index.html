<!doctype html>
<html lang="en" class="dark boot-loading">
  <head>
    <meta charset="utf-8" />
    <title>Tayseer Innovations – Future-Ready Fintech</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tayseer Innovations — Core Banking, Fahim AI, MBuke, and managed FinTech services across Saudi Arabia and the UAE."
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Kumbh+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html.boot-loading body > app-root {
        opacity: 0;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #141b24;
        animation: boot-loader-enter 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-loader.boot-loader--leaving {
        animation: boot-loader-leave 320ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #boot-loader .boot-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: boot-panel-enter 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-loader.boot-loader--leaving .boot-panel {
        animation: boot-panel-leave 280ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      html:not(.dark) #boot-loader {
        background: #f7f9fc;
      }
      #boot-loader svg {
        width: clamp(5rem, 14vw, 7rem);
        height: clamp(5rem, 14vw, 7rem);
        overflow: visible;
      }
      #boot-loader .boot-ghost path {
        fill: none;
        stroke: #095a8d;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.1;
      }
      #boot-loader .boot-ghost path:last-child {
        stroke: #62a845;
      }
      #boot-loader .boot-draw path {
        fill: none;
        stroke: #0d5a8e;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: boot-pen 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #boot-loader .boot-draw path:nth-child(9),
      #boot-loader .boot-draw path:nth-child(10) {
        stroke: #62a845;
        animation-name: boot-pen-green;
      }
      #boot-loader .boot-draw path:nth-child(1) {
        animation-delay: 0s;
      }
      #boot-loader .boot-draw path:nth-child(2) {
        animation-delay: 0.26s;
      }
      #boot-loader .boot-draw path:nth-child(3) {
        animation-delay: 0.52s;
      }
      #boot-loader .boot-draw path:nth-child(4) {
        animation-delay: 0.78s;
      }
      #boot-loader .boot-draw path:nth-child(5) {
        animation-delay: 1.04s;
      }
      #boot-loader .boot-draw path:nth-child(6) {
        animation-delay: 1.3s;
      }
      #boot-loader .boot-draw path:nth-child(7) {
        animation-delay: 1.56s;
      }
      #boot-loader .boot-draw path:nth-child(8) {
        animation-delay: 1.82s;
      }
      #boot-loader .boot-draw path:nth-child(9) {
        animation-delay: 2.08s;
      }
      #boot-loader .boot-draw path:nth-child(10) {
        animation-delay: 2.34s;
      }
      #boot-loader .boot-logo {
        display: block;
        width: clamp(10rem, 36vw, 14rem);
        height: auto;
        margin: 1rem auto 0;
        opacity: 0.9;
      }
      @keyframes boot-pen {
        0% {
          stroke-dashoffset: 100;
          opacity: 1;
          stroke-width: 4.5;
          filter: drop-shadow(0 0 0 rgba(13, 90, 142, 0));
        }
        8% {
          stroke-dashoffset: 55;
          opacity: 1;
          stroke-width: 7.5;
          filter: drop-shadow(0 0 7px rgba(13, 90, 142, 0.75));
        }
        14% {
          stroke-dashoffset: 0;
          opacity: 1;
          stroke-width: 6.5;
          filter: drop-shadow(0 0 4px rgba(13, 90, 142, 0.45));
        }
        68% {
          stroke-dashoffset: 0;
          opacity: 1;
          stroke-width: 6.5;
          filter: drop-shadow(0 0 2px rgba(13, 90, 142, 0.25));
        }
        78% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
        79% {
          stroke-dashoffset: 100;
          opacity: 0;
          stroke-width: 4.5;
        }
        100% {
          stroke-dashoffset: 100;
          opacity: 0;
          stroke-width: 4.5;
        }
      }
      @keyframes boot-pen-green {
        0% {
          stroke-dashoffset: 100;
          opacity: 1;
          stroke-width: 4.5;
          filter: drop-shadow(0 0 0 rgba(98, 168, 69, 0));
        }
        8% {
          stroke-dashoffset: 55;
          opacity: 1;
          stroke-width: 7.5;
          filter: drop-shadow(0 0 8px rgba(98, 168, 69, 0.8));
        }
        14% {
          stroke-dashoffset: 0;
          opacity: 1;
          stroke-width: 6.5;
          filter: drop-shadow(0 0 5px rgba(98, 168, 69, 0.5));
        }
        68% {
          stroke-dashoffset: 0;
          opacity: 1;
          stroke-width: 6.5;
          filter: drop-shadow(0 0 2px rgba(98, 168, 69, 0.3));
        }
        78% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
        79% {
          stroke-dashoffset: 100;
          opacity: 0;
          stroke-width: 4.5;
        }
        100% {
          stroke-dashoffset: 100;
          opacity: 0;
          stroke-width: 4.5;
        }
      }
      @keyframes boot-loader-enter {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes boot-loader-leave {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes boot-panel-enter {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes boot-panel-leave {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateY(-8px) scale(0.96);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-live="polite" aria-busy="true" aria-label="Loading">
      <div class="boot-panel">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g class="boot-ghost">
            <path d="M20 20H100V100" />
            <path d="M20 32H88V100" />
            <path d="M20 44H76V100" />
            <path d="M20 56H64V100" />
            <path d="M20 68H52V100" />
          </g>
          <g class="boot-draw">
            <path pathLength="100" d="M20 20H100" />
            <path pathLength="100" d="M100 20V100" />
            <path pathLength="100" d="M20 32H88" />
            <path pathLength="100" d="M88 32V100" />
            <path pathLength="100" d="M20 44H76" />
            <path pathLength="100" d="M76 44V100" />
            <path pathLength="100" d="M20 56H64" />
            <path pathLength="100" d="M64 56V100" />
            <path pathLength="100" d="M20 68H52" />
            <path pathLength="100" d="M52 68V100" />
          </g>
        </svg>
        <img class="boot-logo" src="/brand/logo-light.svg" alt="Tayseer" width="220" height="48" />
      </div>
    </div>
    <app-root></app-root>
  </body>
</html>
