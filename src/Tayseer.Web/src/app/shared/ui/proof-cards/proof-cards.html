@for (card of cards(); track card.title; let i = $index) {
  <article
    class="fintech-card proof-card"
    [class.proof-card--1]="i === 0"
    [class.proof-card--2]="i === 1"
    [class.proof-card--3]="i === 2"
  >
    <span class="proof-card__icon" aria-hidden="true">
      @switch (card.icon) {
        @case ('shield') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3 4.5 6.5v5.2c0 4.6 3.2 8.8 7.5 9.8 4.3-1 7.5-5.2 7.5-9.8V6.5L12 3Z" stroke-linejoin="round" />
            <path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
        @case ('deploy') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2M12 3v12M8 7l4-4 4 4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="14" rx="2" />
            <path d="M7 8h6M7 12h10" stroke-linecap="round" />
          </svg>
        }
      }
    </span>
    <span class="proof-card__copy">
      <strong>{{ card.title }}</strong>
      <small>{{ card.detail }}</small>
    </span>
  </article>
}

<ul class="proof-card__mobile">
  @for (card of cards(); track card.title) {
    <li>{{ card.title }}</li>
  }
</ul>
