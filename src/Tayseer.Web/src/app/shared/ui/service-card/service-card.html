<a
  [routerLink]="link()"
  class="service-card group glass-card relative flex h-full flex-col overflow-hidden p-0 no-underline outline-none focus-visible:ring-2 focus-visible:ring-brand-green/60"
  (pointerenter)="onCoverEnter()"
  (pointerleave)="onCoverLeave()"
>
  <div class="service-card__media relative h-44 overflow-hidden sm:h-48">
    <img
      #coverImg
      class="h-full w-full object-cover will-change-transform"
      [src]="coverImage()"
      [alt]="service().title"
      width="640"
      height="360"
      loading="lazy"
      decoding="async"
    />
    <div
      class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/15 to-transparent"
      aria-hidden="true"
    ></div>
    <div
      class="absolute inset-x-0 top-0 h-14 bg-gradient-to-b from-brand-blue/30 to-transparent"
      aria-hidden="true"
    ></div>

    <div
      class="service-card__icon absolute bottom-3 start-3 inline-flex h-10 w-10 items-center justify-center rounded-lg border bg-white text-brand-blue shadow-md dark:bg-surface-dark-elevated"
      [class.border-brand-green]="isGreen()"
      [class.text-brand-green]="isGreen()"
      [class.border-brand-blue]="!isGreen()"
      [class.dark:border-brand-green]="true"
      [class.dark:text-brand-green]="true"
    >
      @switch (iconKey()) {
        @case ('ai') {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" stroke-linecap="round" />
          </svg>
        }
        @case ('core-banking') {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 10h18L12 3 3 10Z" stroke-linejoin="round" />
            <path d="M5 10v8h14v-8M9 18v-4h6v4" stroke-linecap="round" />
          </svg>
        }
        @case ('mbuke') {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="7" y="2" width="10" height="20" rx="2" />
            <path d="M11 18h2" stroke-linecap="round" />
          </svg>
        }
        @case ('managed') {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V10c.3.6.9 1 1.5 1H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" stroke-linejoin="round" />
          </svg>
        }
        @case ('software') {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="m8 8-4 4 4 4M16 8l4 4-4 4M13 5l-2 14" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
        @case ('banking-systems') {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="2" />
            <path d="M6 10h.01M10 10h8" stroke-linecap="round" />
          </svg>
        }
        @default {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M8 8h12v12" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M8 12h8v8M8 16h4v4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
      }
    </div>
  </div>

  <div class="relative z-10 flex flex-1 flex-col p-5 sm:p-6">
    <div
      class="geometric-accent pointer-events-none absolute bottom-2 end-2 h-24 w-24 opacity-0 transition duration-300 group-hover:opacity-25"
      aria-hidden="true"
    ></div>

    <h3 class="relative font-display text-fluid-lg font-semibold text-brand-blue dark:text-white">
      {{ service().title }}
    </h3>

    <p class="relative mt-2 flex-1 text-fluid-sm leading-relaxed text-ink-soft dark:text-white/70">
      {{ service().shortDescription }}
    </p>

    <span class="service-card__cta relative mt-5 inline-flex items-center gap-2 text-fluid-sm font-semibold">
      {{ ctaLabel() }}
      <svg
        class="service-card__cta-arrow h-3.5 w-3.5 rtl:rotate-180"
        viewBox="0 0 14 14"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M2 7h9M7.5 3.5 11 7l-3.5 3.5"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
  </div>
</a>
