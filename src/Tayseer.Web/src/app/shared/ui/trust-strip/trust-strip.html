<section class="trust-strip" aria-label="Key performance indicators">
  <div class="trust-strip__grid site-container">
    @for (item of items(); track item.id; let last = $last) {
      <div class="trust-strip__item" [class.trust-strip__item--last]="last">
        <p
          class="trust-strip__value"
          [attr.aria-label]="item.final + ' ' + item.label"
        >
          {{ item.display }}
        </p>
        <p class="trust-strip__label">{{ item.label }}</p>
      </div>
    }
  </div>
</section>
