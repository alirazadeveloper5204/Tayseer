<article class="world-card fintech-card">
  <span class="world-card__icon" aria-hidden="true">
    @switch (icon()) {
      @case ('channels') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="8" height="14" rx="1.5" />
          <rect x="13" y="8" width="8" height="11" rx="1.5" />
          <path d="M6 16h2M16 16h2" stroke-linecap="round" />
        </svg>
      }
      @case ('gateway') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 12h16M8 7v10M16 7v10" stroke-linecap="round" />
          <rect x="3" y="4" width="18" height="16" rx="2" />
        </svg>
      }
      @case ('orchestration') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="6" cy="12" r="2.2" />
          <circle cx="18" cy="7" r="2.2" />
          <circle cx="18" cy="17" r="2.2" />
          <path d="M8.2 12H14M15.8 8.2 9.8 11.2M15.8 15.8 9.8 12.8" stroke-linecap="round" />
        </svg>
      }
      @case ('core') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="7" rx="7" ry="3" />
          <path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5" />
        </svg>
      }
      @case ('risk') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 3 5 6.4v5.3c0 4.4 3.1 8.4 7 9.3 3.9-.9 7-4.9 7-9.3V6.4L12 3Z" stroke-linejoin="round" />
          <path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
      @case ('retail') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="6" y="3" width="12" height="18" rx="2" />
          <path d="M10 18h4" stroke-linecap="round" />
        </svg>
      }
      @case ('corporate') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 20V8l8-4 8 4v12" stroke-linejoin="round" />
          <path d="M9 20v-6h6v6M9 10h.01M15 10h.01M12 10h.01" stroke-linecap="round" />
        </svg>
      }
      @case ('islamic') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 3v3M8 8c2.2-2 5.8-2 8 0M6 20h12M8 20V11h8v9" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 11v9" />
        </svg>
      }
      @case ('digital') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M13 3 5 14h7l-1 7 8-11h-7l1-7Z" stroke-linejoin="round" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="8" />
          <path d="M8 12h8M12 8v8" stroke-linecap="round" />
        </svg>
      }
    }
  </span>
  <h3>{{ title() }}</h3>
  <p>{{ body() }}</p>
</article>
