<section id="home" class="home-hero" aria-label="Hero">
  <div class="home-hero__atmosphere" aria-hidden="true">
    <div class="home-hero__grid"></div>
    <div class="home-hero__glow home-hero__glow--blue"></div>
    <div class="home-hero__glow home-hero__glow--green"></div>
    <div class="home-hero__ring home-hero__ring--outer"></div>
    <div class="home-hero__ring home-hero__ring--inner"></div>

    <svg
      class="home-hero__mark"
      viewBox="0 0 120 120"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path class="home-hero__chevron home-hero__chevron--1" d="M20 20H100V100" />
      <path class="home-hero__chevron home-hero__chevron--2" d="M20 32H88V100" />
      <path class="home-hero__chevron home-hero__chevron--3" d="M20 44H76V100" />
      <path class="home-hero__chevron home-hero__chevron--4" d="M20 56H64V100" />
      <path class="home-hero__chevron home-hero__chevron--5" d="M20 68H52V100" />
    </svg>
  </div>

  <div class="home-hero__content site-container relative flex min-h-[inherit] flex-col justify-center py-fluid-2xl">
    <div class="home-hero__copy">
      <p class="home-hero__eyebrow home-hero__reveal">
        {{ copy().home.eyebrow }}
      </p>
      <h1 class="home-hero__title home-hero__reveal">
        {{ copy().home.headline }}
      </h1>
      <p class="home-hero__lead home-hero__reveal">
        {{ copy().home.subhead }}
      </p>
      <div class="home-hero__cta home-hero__reveal mt-fluid-lg flex flex-wrap gap-fluid-sm">
        <a [routerLink]="'/' + lang() + '/solutions'" class="btn-brand home-hero__cta-item">
          {{ copy().common.exploreSolutions }}
        </a>
        <a
          [routerLink]="'/' + lang() + '/contact'"
          class="home-hero__cta-item home-hero__cta-secondary"
        >
          {{ copy().common.talkToUs }}
        </a>
      </div>
      <ul class="home-hero__trust home-hero__reveal" aria-label="Trust">
        <li>{{ copy().trust.solutions }}</li>
        <li>{{ copy().trust.cities }}</li>
        <li>{{ copy().trust.iso }}</li>
      </ul>
    </div>
  </div>

  <div class="home-hero__fade" aria-hidden="true"></div>

  <div class="home-hero__scroll" aria-hidden="true">
    <span class="home-hero__scroll-mouse">
      <span class="home-hero__scroll-dot"></span>
    </span>
    <span class="home-hero__scroll-chevron"></span>
  </div>
</section>

<app-services-bento />
<app-home-story />
