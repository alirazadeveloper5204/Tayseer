# Render Blueprint — free tier demo stack
# https://render.com/docs/blueprint-spec
#
# Notes:
# - Free web services sleep after ~15 min idle (cold start on next request).
# - Free Render Postgres expires after 30 days; use Neon free for longer-lived DB.
# - After first deploy, set Cors__AngularOrigins__0 to your web service URL.
# - Docker: do NOT use dockerBuildArgs (unsupported). Set env vars instead —
#   Render maps service env vars to Docker build ARGs automatically.

services:
  - type: web
    name: tayseer-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/Tayseer.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: Database__Provider
        value: Npgsql
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: tayseer-db
          property: connectionString
      - key: Cors__AngularOrigins__0
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Jwt__Issuer
        value: Tayseer.Api
      - key: Jwt__Audience
        value: Tayseer.Admin
      - key: AdminSeed__Email
        value: admin@tayseer.me
      - key: AdminSeed__DisplayName
        value: Tayseer Admin
      - key: AdminSeed__Password
        sync: false
      - key: Ollama__RagEnabled
        value: "false"

  - type: web
    name: tayseer-web
    runtime: docker
    plan: free
    dockerfilePath: ./src/Tayseer.Web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      # Upstream API for the SSR reverse proxy (/api, /hubs, /health) and baked SSR fetches.
      # Browser calls same-origin /api — the API hostname is not in client JS.
      # Use the exact public hostname from the API service (may include a random suffix).
      - key: API_BASE_URL
        value: https://tayseer-api-mp4f.onrender.com
      # Canonical site origin for SEO (sitemap, Open Graph, JSON-LD).
      - key: SITE_URL
        value: https://tayseer-web.onrender.com
      # Optional: private-network URL for paid plans only.
      # Leave UNSET on free tier — free services cannot receive private traffic and it will not wake sleepers.
      # Example (paid): http://tayseer-api:10000
      - key: SSR_API_BASE_URL
        sync: false
      # Optional override for the Node proxy only (defaults to SSR_API_BASE_URL || API_BASE_URL).
      # Prefer leaving unset so wake + proxy use public API_BASE_URL on free tier.
      - key: API_PROXY_TARGET
        sync: false

databases:
  - name: tayseer-db
    plan: free
    databaseName: tayseer
    user: tayseer
