# Render Blueprint — free tier demo stack
# https://render.com/docs/blueprint-spec
#
# Notes:
# - Free web services sleep after ~15 min idle (cold start on next request).
# - Free Render Postgres expires after 30 days; use Neon free for longer-lived DB.
# - After first deploy, set Cors__AngularOrigins__0 to your web service URL.
# - Docker: do NOT use dockerBuildArgs (unsupported). Set env vars instead —
#   Render maps service env vars to Docker build ARGs automatically.

services:
  - type: web
    name: tayseer-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/Tayseer.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: Database__Provider
        value: Npgsql
      # Paste the Internal Database URL from the existing Render Postgres `tayseer-db`
      # (Dashboard → tayseer-db → Connections). Free tier allows only one Postgres;
      # that DB was already provisioned, so this Blueprint does not create another.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__AngularOrigins__0
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Jwt__Issuer
        value: Tayseer.Api
      - key: Jwt__Audience
        value: Tayseer.Admin
      - key: AdminSeed__Email
        value: admin@tayseer.me
      - key: AdminSeed__DisplayName
        value: Tayseer Admin
      - key: AdminSeed__Password
        sync: false
      - key: Ollama__RagEnabled
        value: "false"

  - type: web
    name: tayseer-web
    runtime: docker
    plan: free
    dockerfilePath: ./src/Tayseer.Web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      # Upstream API for the SSR reverse proxy (/api, /hubs, /health) and baked SSR fetches.
      # Browser calls same-origin /api — the API hostname is not in client JS.
      # After first deploy, if Render assigned a random suffix, update these to the
      # exact dashboard URLs and Manual Deploy (clear build cache) the web service.
      - key: API_BASE_URL
        value: https://tayseer-api.onrender.com
      - key: SITE_URL
        value: https://tayseer-web.onrender.com
      # Leave blank on free tier (private network cannot reach free web services).
      - key: SSR_API_BASE_URL
        sync: false
      # Leave blank unless you need a proxy override.
      - key: API_PROXY_TARGET
        sync: false
